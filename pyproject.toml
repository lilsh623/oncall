[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-oncall"
version = "0.1.0"
description = "Intelligent OnCall Agent backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "celery[redis]",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langchain-openai",
    "pymilvus",
    "mcp",
    "argon2-cffi",
    "PyJWT",
    "httpx",
    "structlog",
    "prometheus-client",
    "typer",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "podman-compose>=1.6,<2",
]

[project.scripts]
oncall = "oncall.cli.app:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
