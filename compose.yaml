services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oncall
      POSTGRES_USER: oncall
      POSTGRES_PASSWORD: oncall
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: local
    ports: ["127.0.0.1:19530:19530"]
    volumes: ["milvus-data:/var/lib/milvus"]

  api:
    build:
      context: .
      dockerfile: containers/api.Containerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://oncall:oncall@postgres:5432/oncall
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      RECOVERY_MCP_URL: http://recovery-mcp:8080/mcp
    command: ["python", "-m", "uvicorn", "oncall.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [postgres, redis, milvus]

  worker:
    build:
      context: .
      dockerfile: containers/api.Containerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://oncall:oncall@postgres:5432/oncall
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      RECOVERY_MCP_URL: http://recovery-mcp:8080/mcp
    command: ["python", "-m", "celery", "-A", "oncall.jobs.celery_app:celery_app", "worker", "--loglevel=INFO"]
    depends_on: [postgres, redis, milvus, recovery-mcp]

  recovery-mcp:
    build:
      context: .
      dockerfile: containers/api.Containerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "uvicorn", "mcp_servers.recovery.server:app", "--host", "0.0.0.0", "--port", "8080"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [redis]

  frontend:
    build:
      context: .
      dockerfile: containers/frontend.Containerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]

volumes:
  postgres-data:
  redis-data:
  milvus-data:
