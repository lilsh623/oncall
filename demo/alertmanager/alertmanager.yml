route:
  receiver: oncall-api
  group_by: [alertname, project_id, environment, service]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: oncall-api
    webhook_configs:
      # API and Alertmanager run on the same private Compose network.  Using the
      # service name avoids a Podman-Machine-to-macOS host callback.
      - url: http://api:8000/api/v1/webhooks/alertmanager/demo-shop
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: demo-only-change-me-alertmanager-secret
