groups:
  - name: demo-service
    rules:
      - alert: HighErrorRate
        expr: |
          (sum(rate(demo_http_requests_total[2m])) > 0)
          and
          (
            sum(rate(demo_http_requests_total{status=~"5.."}[2m]))
            /
            sum(rate(demo_http_requests_total[2m])) > 0.30
          )
        for: 30s
        labels:
          project_id: demo-shop
          environment: staging
          service: order-api
          severity: critical
          correlation_key: release-regression
        annotations:
          summary: Order API error rate is above 30 percent
          description: The demo order API has exceeded the release-regression error threshold for two minutes.
