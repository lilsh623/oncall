name: post_deployment_regression
version: 1.0.0
description: Investigate a service regression that starts near a release window.
triggers:
  alert_names:
    - HighErrorRate
    - HighLatency
  service_types:
    - http-api
  labels:
    correlation_key: release-regression
allowed_tools:
  - query_metrics
  - query_service_logs
  - get_service_health
  - get_current_release
  - get_recent_releases
  - get_release_diff
forbidden_actions:
  - rollback
  - restart
  - scale
  - arbitrary_write
output_schema:
  type: object
  properties:
    observations:
      type: array
      description: Bounded observations backed by read-only tool results.
      items:
        type: string
    release_correlation:
      type: string
      description: Whether timing and version evidence correlate with the regression.
    confidence:
      type: number
      description: Confidence from zero to one based only on collected evidence.
    missing_evidence:
      type: array
      description: Facts still needed before diagnosis or remediation planning.
      items:
        type: string
  required:
    - observations
    - release_correlation
    - confidence
    - missing_evidence
  additionalProperties: false
